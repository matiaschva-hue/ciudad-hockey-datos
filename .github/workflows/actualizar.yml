name: Actualizar Ciudad Hockey
on:
  schedule:
    # GitHub demora o saltea corridas programadas (a veces horas): por eso hay muchas, con minutos sueltos.
    # Las de horario de partido van en modo RÁPIDO (solo torneos con partidos ayer/hoy/mañana, ~1-2 min).
    # sáb y dom: cada 15 min de 10 a 23:59 h (hora argentina = UTC-3)
    - cron: '7,22,37,52 13-23 * * 6,0'
    - cron: '7,22,37,52 0-2 * * 0,1'
    # lunes a viernes (partidos entre semana y feriados): cada 15 min de 17 a 23:59 h
    - cron: '7,22,37,52 20-23 * * 1-5'
    - cron: '7,22,37,52 0-2 * * 2-6'
    # pasada completa (todos los torneos): todos los días 6:41 h
    - cron: '41 9 * * *'
    # avisos al celular (pedidos de acceso, qué publicar): cada hora de 8 a 23 h, sin leer LarrySport
    - cron: '47 11-23,0-2 * * *'
    # torneos + planteles: martes 23:43 h
    - cron: '43 2 * * 3'
  workflow_dispatch:
    inputs:
      modo:
        description: 'rapido (solo torneos con partidos ayer/hoy/mañana, 1-2 min), fixture (todos los torneos), planteles (torneos + planillas, ~40 min), historico (una temporada anterior, ~2 h), historico-prueba (lee sin subir), registros (n° de registro AHBA, solo con repo privado) o explorar'
        type: choice
        options: [rapido, avisos, fixture, planteles, registros, historico, historico-prueba, explorar]
        default: rapido
      temporada:
        description: 'Temporada para historico (2022 a 2025)'
        type: string
        default: '2025'
permissions:
  contents: write
# cada temporada histórica en su propio grupo: no se cancelan entre sí ni frenan las corridas programadas
concurrency: ${{ startsWith(github.event.inputs.modo, 'historico') && format('historico-{0}', github.event.inputs.temporada) || 'actualizar' }}
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ startsWith(github.event.inputs.modo, 'historico') && 240 || 90 }}
    env:
      CHROME_PATH: /usr/bin/google-chrome
      TZ: America/Argentina/Buenos_Aires
      MODO: ${{ github.event.inputs.modo || (github.event.schedule == '43 2 * * 3' && 'planteles' || (github.event.schedule == '41 9 * * *' && 'fixture' || (github.event.schedule == '47 11-23,0-2 * * *' && 'avisos' || 'rapido'))) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # pdftotext para leer las planillas (goleadores de cada partido)
      - if: env.MODO != 'avisos'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null
      - name: Fixture, resultados y tablas
        if: env.MODO == 'fixture' || env.MODO == 'rapido'
        run: node larry.mjs leer
        env:
          RAPIDO: ${{ env.MODO == 'rapido' && '1' || '' }}
      - name: Torneos (de nuevo) + fixture
        if: env.MODO == 'planteles'
        run: node larry.mjs todo
      - name: Planteles desde las planillas
        if: env.MODO == 'planteles' || env.MODO == 'registros'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null
          node planillas.mjs todo
      - name: Goleadores oficiales (necesita los planteles para separar Caballeros A y B)
        if: env.MODO == 'planteles'
        run: node goleadores.mjs
      # números de registro AHBA de cada jugador/a: solo se guardan si el repo es privado (adjunto de la corrida, 30 días)
      - name: ¿Repo privado?
        id: privado
        if: env.MODO == 'planteles' || env.MODO == 'registros'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "privado=$(gh api repos/${{ github.repository }} --jq .private)" >> "$GITHUB_OUTPUT"
      - name: Guardar registros (privado)
        if: steps.privado.outputs.privado == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: registros
          path: registros.json
          retention-days: 30
      - name: Registros no guardados (repo público)
        if: steps.privado.outputs.privado == 'false'
        run: echo 'El repo es público, registros.json no se guarda.'
      - name: Explorar temporadas anteriores (no escribe nada)
        if: env.MODO == 'explorar'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null
          node historico.mjs planilla
      - name: Temporada anterior desde LarrySport
        if: startsWith(env.MODO, 'historico')
        env:
          TEMPORADA: ${{ github.event.inputs.temporada }}
        run: |
          node larry.mjs todo
          node historico.mjs subir "$TEMPORADA" ${{ env.MODO == 'historico-prueba' && '--seco' || '' }}
      - name: Subir a Firestore
        if: env.MODO == 'fixture' || env.MODO == 'planteles' || env.MODO == 'rapido'
        run: node subir.mjs
      - name: Perfiles de jugadores (temporada actual + anteriores)
        if: env.MODO == 'fixture' || env.MODO == 'planteles'
        run: node perfiles.mjs
      - name: Control de datos (avisos en el resumen de la corrida)
        if: env.MODO == 'fixture' || env.MODO == 'planteles'
        run: node auditar.mjs
      - name: Avisos al celular (qué publicar, resultados, pedidos de acceso)
        if: always() && (env.MODO == 'fixture' || env.MODO == 'planteles' || env.MODO == 'rapido' || env.MODO == 'avisos')
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: node avisos.mjs
      - name: Guardar lista de torneos si cambió
        if: env.MODO == 'fixture' || env.MODO == 'planteles'
        run: |
          git config user.name "ciudad-hockey-bot"
          git config user.email "actions@users.noreply.github.com"
          git add larry_torneos.json
          git diff --cached --quiet || (git commit -m "Torneos $(date +%F)" && git push)
